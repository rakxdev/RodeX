name = "rodex-gateway"
main = "src/index.ts"
compatibility_date = "2026-05-01"
# MCP SDK (agents) uses node:async_hooks internally — supported via nodejs_compat (free plan OK).
compatibility_flags = ["nodejs_compat"]

# ── Triggers ──────────────────────────────────────────────────────────────
# Purge worker: finalizes scheduled (soft) deletions every minute.
# NOTE: cron CPU on free plan is 10 ms — network waits do not count toward CPU.
[triggers]
crons = ["* * * * *"]

# ── Vars (non-secret config) ────────────────────────────────────────────────
[vars]
STORAGE = "aws" # "mock" (no AWS needed) | "aws" (real DynamoDB)
DASHBOARD_ORIGIN = "https://rodexdb.pages.dev" # CORS + cookie target
GITHUB_ALLOWED_USERS = "rakxdev,newylbot,luminoxpp"

# ── Secrets (wrangler secret put <NAME>): ───────────────────────────────────
# ADMIN_PASSWORD            fallback dashboard login (min 12 chars)
# SESSION_SECRET            HMAC secret for session cookies (min 24 chars)
# GITHUB_CLIENT_ID          GitHub OAuth app client id
# GITHUB_CLIENT_SECRET      GitHub OAuth app client secret
# AWS_ACCESS_KEY_ID         IAM user with least-privilege policy (docs/iam.md)
# AWS_SECRET_ACCESS_KEY     same

# ── Strict rate limiting (single-point Durable Object counters) ─────────────
# One shared RateLimiterDO owns every budget: no edge lag, no burst tolerance.
# Limits live in src/limits.ts (RATE_*); counters reset at each 60 s window.
[[durable_objects.bindings]]
name = "RL_DO"
class_name = "RateLimiterDO"

[[migrations]]
tag = "v1"
# free plan: new DO classes must be SQLite-backed
new_sqlite_classes = ["RateLimiterDO"]