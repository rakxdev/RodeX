<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" role="img" aria-label="RodexDB architecture: clients and agents -> Cloudflare gateway worker -> DynamoDB free tier">
  <style>
    /* Dark mode is the default; adapts to GitHub light mode automatically. */
    .bg   { fill: #0e0f0d; }
    .panel{ fill: #161816; }
    .line { stroke: #2a2c28; }
    .ink  { fill: #e8e4da; }
    .dim  { fill: #8a9184; }
    .gold { fill: #d9b64a; }
    .red  { fill: #e8452c; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    @media (prefers-color-scheme: light) {
      .bg   { fill: #fdfdfc; }
      .panel{ fill: #f4f3ef; }
      .line { stroke: #dcdad2; }
      .ink  { fill: #1a1b19; }
      .dim  { fill: #6b7064; }
    }
  </style>

  <rect class="bg" width="920" height="560" rx="14"/>

  <!-- title -->
  <text x="460" y="34" text-anchor="middle" class="mono ink" font-size="15" font-weight="700" letter-spacing="4">RODEXDB — ARCHITECTURE</text>
  <text x="460" y="52" text-anchor="middle" class="mono dim" font-size="10" letter-spacing="2">EVERYTHING ON FREE TIERS · $0 FOREVER</text>

  <!-- ── clients row ─────────────────────────────────────────────── -->
  <g>
    <rect x="40"  y="80" width="250" height="92" rx="10" class="panel" stroke="#8a9184" stroke-width="1.2"/>
    <text x="165" y="106" text-anchor="middle" class="mono gold" font-size="12" letter-spacing="2">BROWSER</text>
    <text x="165" y="126" text-anchor="middle" class="mono ink" font-size="11">Console / Dashboard</text>
    <text x="165" y="142" text-anchor="middle" class="mono dim" font-size="10">rodexdb.pages.dev</text>
    <text x="165" y="158" text-anchor="middle" class="mono dim" font-size="9">login · apps · keys · meters</text>

    <rect x="335" y="80" width="250" height="92" rx="10" class="panel" stroke="#d9b64a" stroke-width="1.2"/>
    <text x="460" y="106" text-anchor="middle" class="mono gold" font-size="12" letter-spacing="2">CODING AGENTS</text>
    <text x="460" y="126" text-anchor="middle" class="mono ink" font-size="11">MCP · one master key</text>
    <text x="460" y="142" text-anchor="middle" class="mono dim" font-size="10">/mcp · 21 tools</text>
    <text x="460" y="158" text-anchor="middle" class="mono dim" font-size="9">Cursor · Claude Code · any MCP client</text>

    <rect x="630" y="80" width="250" height="92" rx="10" class="panel" stroke="#8a9184" stroke-width="1.2"/>
    <text x="755" y="106" text-anchor="middle" class="mono gold" font-size="12" letter-spacing="2">YOUR APPS</text>
    <text x="755" y="126" text-anchor="middle" class="mono ink" font-size="11">Bots · Websites · Scripts</text>
    <text x="755" y="142" text-anchor="middle" class="mono dim" font-size="10">REST API + per-app key</text>
    <text x="755" y="158" text-anchor="middle" class="mono dim" font-size="9">/v1/items · query · tables</text>
  </g>

  <!-- ── arrows: clients → gateway ────────────────────────────────── -->
  <g class="line" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M165 172 L165 218 L330 238"/>
    <path d="M460 172 L460 218"/>
    <path d="M755 172 L755 218 L590 238"/>
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 z" fill="#8a9184"/>
    </marker>
  </defs>

  <!-- ── gateway worker ───────────────────────────────────────────── -->
  <rect x="250" y="240" width="420" height="150" rx="12" class="panel" stroke="#d9b64a" stroke-width="1.6"/>
  <text x="460" y="264" text-anchor="middle" class="mono gold" font-size="13" letter-spacing="2">GATEWAY WORKER</text>
  <text x="460" y="281" text-anchor="middle" class="mono dim" font-size="9.5">rodex-gateway.rakxdev.workers.dev · TypeScript + Hono</text>

  <g class="mono" font-size="10">
    <rect x="272" y="294" width="112" height="34" rx="7" class="bg" stroke="#2a2c28"/>
    <text x="328" y="315" text-anchor="middle" class="ink">REST /v1/*</text>
    <rect x="394" y="294" width="112" height="34" rx="7" class="bg" stroke="#2a2c28"/>
    <text x="450" y="315" text-anchor="middle" class="ink">MCP /mcp</text>
    <rect x="516" y="294" width="132" height="34" rx="7" class="bg" stroke="#2a2c28"/>
    <text x="582" y="315" text-anchor="middle" class="ink">RateLimiterDO</text>
    <rect x="272" y="338" width="112" height="34" rx="7" class="bg" stroke="#2a2c28"/>
    <text x="328" y="359" text-anchor="middle" class="ink">Purge cron</text>
    <rect x="394" y="338" width="232" height="34" rx="7" class="bg" stroke="#2a2c28"/>
    <text x="510" y="359" text-anchor="middle" class="ink">Master-key auth · confirm gate</text>
  </g>

  <!-- pages host label on the browser lane -->
  <text x="248" y="213" text-anchor="middle" class="mono dim" font-size="8.5" letter-spacing="1">PAGES HOST · STATIC</text>

  <!-- ── DynamoDB ─────────────────────────────────────────────────── -->
  <g class="line" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M460 390 L460 424"/>
  </g>
  <rect x="180" y="426" width="560" height="110" rx="12" class="panel" stroke="#e8452c" stroke-width="1.6"/>
  <text x="460" y="450" text-anchor="middle" class="mono red" font-size="13" letter-spacing="2">DYNAMODB · ap-southeast-1</text>
  <text x="460" y="467" text-anchor="middle" class="mono dim" font-size="9.5">ALWAYS-FREE TIER — 25 GB · 25 WCU · 25 RCU PROVISIONED</text>
  <g class="mono" font-size="9.5">
    <rect x="200" y="478" width="120" height="42" rx="7" class="bg" stroke="#2a2c28"/>
    <text x="260" y="497" text-anchor="middle" class="ink">rodex_apps</text>
    <text x="260" y="511" text-anchor="middle" class="dim">registry</text>
    <rect x="330" y="478" width="120" height="42" rx="7" class="bg" stroke="#2a2c28"/>
    <text x="390" y="497" text-anchor="middle" class="ink">rodex_idem</text>
    <text x="390" y="511" text-anchor="middle" class="dim">TTL expiry</text>
    <rect x="460" y="478" width="120" height="42" rx="7" class="bg" stroke="#2a2c28"/>
    <text x="520" y="497" text-anchor="middle" class="ink">rodex_meta</text>
    <text x="520" y="511" text-anchor="middle" class="dim">settings</text>
    <rect x="590" y="478" width="130" height="42" rx="7" class="bg" stroke="#2a2c28"/>
    <text x="655" y="497" text-anchor="middle" class="ink">rodex_mcp_keys</text>
    <text x="655" y="511" text-anchor="middle" class="dim">master keys</text>
  </g>

  <!-- ── footer: the math ─────────────────────────────────────────── -->
  <text x="460" y="553" text-anchor="middle" class="mono dim" font-size="9.5" letter-spacing="1">PER-APP: 600 total · 120 writes · 240 reads / min — MCP: own budgets — one write ≤ 20 KB — never throttled by design</text>
</svg>