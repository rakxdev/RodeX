name: Probe Deploy ASCII

# Auto-deploys the gateway worker to Cloudflare after CI passes on main.
# Enabled by adding two repo SECRETS (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   (the cfut_... API token - never commit it)
#   CLOUDFLARE_ACCOUNT_ID
# While secrets are absent the deploy step is skipped with a notice and the
# run stays GREEN (deploys remain manual - docs/ci-cd.md).
# Rollback: `npx wrangler rollback`.

on:
  push:
    branches: [main]
    paths:
      - "gateway/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

concurrency:
  group: deploy-gateway
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Auto-deploy disabled notice
        if: ${{ secrets.CLOUDFLARE_API_TOKEN == '' }}
        run: echo "::notice::Auto-deploy disabled - add CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID repo secrets (docs/ci-cd.md)."

      - name: Deploy gateway worker
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: gateway
          command: deploy
