name: Publish npm packages

# Publishes rodexdb + rodex-mcp on version tags (v*).
# Uses npm TRUSTED PUBLISHING (OIDC) — no tokens stored anywhere.
# One-time setup per package on npmjs.com: Settings → Trusted Publisher →
# GitHub Actions → org `rakxdev`, repo `RodeX`, workflow `publish.yml`,
# allowed action `npm publish`.

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write # required for npm OIDC trusted publishing
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Test + publish rodexdb
        run: |
          cd packages/rodexdb
          npm install
          npm test
          npm run build
          npm publish --access public

      - name: Test + publish rodex-mcp
        run: |
          cd packages/rodex-mcp
          npm install
          npm test
          npm run build
          npm publish --access public
