name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint gateway/src gateway/test

      - name: Type check
        run: npx tsc --noEmit -p .

      - name: Contract validation + drift check
        run: npm run contract:check

      - name: Unit tests
        run: npm test
      - name: Dashboard typecheck
        run: cd dashboard && npx tsc --noEmit
      - name: Dashboard build
        run: cd dashboard && npm run build
      - name: Packages build + tests (SDK + MCP wrapper)
        run: |
          npm install --prefix packages/rodexdb --no-audit --no-fund
          npm install --prefix packages/rodex-mcp --no-audit --no-fund
          npm run build:packages && npm run test:packages

      - name: Build gate (worker bundles)
        run: cd gateway && npx wrangler deploy --dry-run | grep -q "Total Upload"

      - name: Security audit
        run: npm audit --audit-level=high
