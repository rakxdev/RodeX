name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint gateway/src gateway/test

      - name: Type check
        run: npx tsc --noEmit -p .

      - name: Unit tests
        run: npm test

      - name: Build gate (worker bundles)
        run: cd gateway && npx wrangler deploy --dry-run | grep -q "Total Upload"

      - name: Security audit
        run: npm audit --audit-level=high
