name: Deploy Gateway

# Auto-deploys the gateway worker to Cloudflare after CI passes on main.
# Enabled by adding two repo SECRETS (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   (the cfut_... API token - never commit it)
#   CLOUDFLARE_ACCOUNT_ID
# While secrets are absent the deploy step prints a notice and exits clean
# (run stays GREEN; deploys remain manual - docs/ci-cd.md).
# Rollback: `npx wrangler rollback`.

on:
  push:
    branches: [main]
    paths:
      - "gateway/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

concurrency:
  group: deploy-gateway
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Deploy gateway worker (or notice when disabled)
        working-directory: gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::Auto-deploy disabled - add CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID repo secrets (docs/ci-cd.md)."
            exit 0
          fi
          npx wrangler deploy
