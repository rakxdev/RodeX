name: Deploy Gateway

# Auto-deploys the gateway worker to Cloudflare when quality gates pass on main.
# ENABLE by setting a repository VARIABLE + two SECRETS
# (Settings → Secrets and variables → Actions):
#   Variable:  ENABLE_DEPLOY = true
#   Secret:    CLOUDFLARE_API_TOKEN   (the cfut_... API token — never commit it)
#   Secret:    CLOUDFLARE_ACCOUNT_ID
# Until the variable is set, this job is skipped (green run, no deploy) and
# deploys stay manual (docs/ci-cd.md). Rollback: `npx wrangler rollback`.

on:
  push:
    branches: [main]
    paths:
      - "gateway/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

concurrency:
  group: deploy-gateway
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # NOTE: `secrets` context is NOT allowed in job-level if; use a variable.
    if: ${{ vars.ENABLE_DEPLOY == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Fail loudly if secrets are missing
        if: ${{ secrets.CLOUDFLARE_API_TOKEN == '' }}
        run: |
          echo "::error::ENABLE_DEPLOY is true but CLOUDFLARE_API_TOKEN secret is missing — add it in repo settings, then re-run."
          exit 1

      - name: Deploy gateway worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: gateway
          command: deploy
