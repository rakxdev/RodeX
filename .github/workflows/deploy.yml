name: Deploy Gateway

# Auto-deploys the gateway worker to Cloudflare when quality gates pass on main.
# Requires two repo secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  (the cfut_... API token — never commit it)
#   CLOUDFLARE_ACCOUNT_ID
# Until those secrets exist, this workflow is skipped and deploys stay manual
# (see docs/ci-cd.md). Rollback: `npx wrangler rollback` (docs/ci-cd.md).

on:
  push:
    branches: [main]
    paths:
      - "gateway/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

concurrency:
  group: deploy-gateway
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Deploy gateway worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: gateway
          command: deploy
