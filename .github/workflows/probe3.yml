name: Probe Structure
on:
  push:
    branches: [main]
    paths:
      - "gateway/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:
concurrency:
  group: deploy-probe
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install
        run: npm ci
      - name: Deploy placeholder
        run: echo "deploy step would run here"
