<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="Founder card: Rakesh (rakxdev), founder and operator of RodexDB">
  <style>
    .bg   { fill: #0e0f0d; }
    .panel{ fill: #161816; }
    .line { stroke: #2a2c28; }
    .ink  { fill: #e8e4da; }
    .dim  { fill: #8a9184; }
    .gold { fill: #d9b64a; }
    .red  { fill: #e8452c; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    @media (prefers-color-scheme: light) {
      .bg   { fill: #fdfdfc; }
      .panel{ fill: #f4f3ef; }
      .line { stroke: #dcdad2; }
      .ink  { fill: #1a1b19; }
      .dim  { fill: #6b7064; }
    }
  </style>

  <!-- frame -->
  <rect class="bg" width="640" height="300" rx="18"/>
  <rect x="16" y="16" width="608" height="268" rx="14" class="panel" stroke="#d9b64a" stroke-width="1.4"/>
  <rect x="16" y="16" width="608" height="4" rx="2" fill="#d9b64a"/>

  <!-- centered mark (mini PACKET-RETICLE-KEY) -->
  <g transform="translate(296,44) scale(2.2)">
    <path d="M32 6 L56 22 L32 58 L8 22 Z" fill="none" stroke="#d9b64a" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M32 10 L52 22 M32 10 L12 22 M32 54 L52 42 M32 54 L12 42" stroke="#8a9184" stroke-width="1.3"/>
    <path d="M20 18 L44 42 M46 18 L22 42" stroke="#e8e4da" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="32" cy="32" r="2" fill="#e8452c"/>
    <rect x="22" y="2" width="20" height="6" fill="#d9b64a"/>
  </g>

  <!-- centered name block -->
  <text x="320" y="168" text-anchor="middle" class="mono ink" font-size="32" font-weight="700" letter-spacing="4">RAKESH</text>
  <text x="320" y="196" text-anchor="middle" class="mono gold" font-size="12" letter-spacing="4">FOUNDER &amp; OPERATOR</text>
  <text x="320" y="224" text-anchor="middle" class="mono dim" font-size="12" letter-spacing="1.5">github.com/rakxdev</text>

  <!-- single line, inside the card, no overflow -->
  <text x="320" y="258" text-anchor="middle" class="mono dim" font-size="10" letter-spacing="1.2">RODEXDB — FREE FOR PERSONAL &amp; EDUCATIONAL USE · COMMERCIAL USE STRICTLY FORBIDDEN</text>
</svg>