<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img" aria-label="Founder card: Rakesh (rakxdev), founder and operator of RodexDB">
  <style>
    .bg   { fill: #0e0f0d; }
    .panel{ fill: #161816; }
    .line { stroke: #2a2c28; }
    .ink  { fill: #e8e4da; }
    .dim  { fill: #8a9184; }
    .gold { fill: #d9b64a; }
    .red  { fill: #e8452c; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    @media (prefers-color-scheme: light) {
      .bg   { fill: #fdfdfc; }
      .panel{ fill: #f4f3ef; }
      .line { stroke: #dcdad2; }
      .ink  { fill: #1a1b19; }
      .dim  { fill: #6b7064; }
    }
  </style>

  <rect class="bg" width="720" height="240" rx="16"/>
  <rect x="14" y="14" width="692" height="212" rx="12" class="panel" stroke="#d9b64a" stroke-width="1.4"/>

  <!-- gold rule -->
  <rect x="14" y="14" width="692" height="3" rx="1.5" fill="#d9b64a"/>

  <!-- mark (mini PACKET-RETICLE-KEY) -->
  <g transform="translate(44,52) scale(2.4)">
    <path d="M32 6 L56 22 L32 58 L8 22 Z" fill="none" stroke="#d9b64a" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M32 10 L52 22 M32 10 L12 22 M32 54 L52 42 M32 54 L12 42" stroke="#8a9184" stroke-width="1.3"/>
    <path d="M20 18 L44 42 M46 18 L22 42" stroke="#e8e4da" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="32" cy="32" r="2" fill="#e8452c"/>
    <rect x="22" y="2" width="20" height="6" fill="#d9b64a"/>
  </g>

  <!-- name -->
  <text x="150" y="92" class="mono ink" font-size="30" font-weight="700" letter-spacing="3">RAKESH</text>
  <text x="150" y="120" class="mono gold" font-size="13" letter-spacing="4">FOUNDER &amp; OPERATOR</text>

  <!-- handle + role line -->
  <text x="150" y="148" class="mono dim" font-size="12" letter-spacing="1.5">github.com/rakxdev</text>
  <text x="150" y="170" class="mono dim" font-size="10.5" letter-spacing="1">BUILT RODEXDB AS A PERSONAL INSTRUMENT —</text>
  <text x="150" y="185" class="mono dim" font-size="10.5" letter-spacing="1">FREE FOR PERSONAL &amp; EDUCATIONAL USE.</text>

  <!-- right column: the stack line -->
  <line x1="560" y1="52" x2="560" y2="188" class="line" stroke-width="1"/>
  <text x="580" y="76" class="mono gold" font-size="10" letter-spacing="2">THE STACK</text>
  <text x="580" y="98" class="mono ink" font-size="10.5" letter-spacing="0.5">TypeScript · Hono · aws4fetch</text>
  <text x="580" y="114" class="mono ink" font-size="10.5" letter-spacing="0.5">React · Vite · Tailwind · Framer</text>
  <text x="580" y="130" class="mono ink" font-size="10.5" letter-spacing="0.5">Cloudflare Workers · Pages · DO</text>
  <text x="580" y="146" class="mono ink" font-size="10.5" letter-spacing="0.5">DynamoDB (always-free)</text>
  <text x="580" y="170" class="mono dim" font-size="9.5" letter-spacing="1">COST: $0 FOREVER — BY DESIGN</text>
</svg>